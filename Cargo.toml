[package]
name    = "mods-checker"
authors = ["Ben C <bwc9876@gmail.com>"]
version = "0.9.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.104"
clap = "4.6.6"
clap_derive = "4.6.4"
octocrab = { version = "0.54.1", default-features = false, features = [
        "rustls-aws-lc-rs",
        "follow-redirect",
        "jwt-rust-crypto",
        "retry",
        "rustls",
        "timeout",
        "tracing",
        "default-client",
] }
owmods_core = "0.15.7"
rustls = "0.23.43"
serde = "1.0.229"
serde_derive = "1.0.229"
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
versions = "7.0.0"

[profile.release]
panic         = "abort"
codegen-units = 1
lto           = true
opt-level     = "z"
strip         = true
