[package]
name = "mods-checker"
authors = [ "Ben C <bwc9876@gmail.com>" ]
version = "0.8.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.100"
clap = "4.5.54"
clap_derive = "4.5.49"
octocrab = { version = "0.49.5", default-features = false, features = ["rustls-aws-lc-rs", "follow-redirect", "jwt-rust-crypto", "retry", "rustls", "timeout", "tracing", "default-client"]}
owmods_core = "0.15.4"
rustls = "0.23.36"
serde = "1.0.228"
serde_derive = "1.0.228"
serde_json = "1.0.149"
tempfile = "3.24.0"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros"] }
versions = "7.0.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
